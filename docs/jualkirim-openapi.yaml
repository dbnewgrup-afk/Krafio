  /api/v1/payments/{id}/checkout:
    post:
      tags: [Payment]
      summary: Mulai pembayaran (checkout)
      description: |
        Membuat billing di penyedia pembayaran untuk pembayaran vendor ini.
        Response berisi detail cara bayar sesuai metode: `qr_string` (QRIS),
        `payment_code` (VA), atau `payment_link`.
        Daftar metode tersedia di `GET /api/v1/payment-methods`.

        Permission role yang dibutuhkan: `payment-read`.
      operationId: apiPaymentCheckout
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method]
              properties:
                payment_method:
                  type: string
                  description: Kode metode pembayaran dari GET /api/v1/payment-methods
                  example: QRIS
      responses:
        '200':
          description: Billing dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Format request tidak valid atau validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Pembayaran tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Gagal membuat billing (mis. status bukan pending, metode tidak valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Payment]
      summary: Ambil ulang detail billing aktif (resume)
      description: Mengembalikan detail QR/VA billing yang masih aktif setelah checkout dimulai.
      operationId: apiPaymentResumeCheckout
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pembayaran tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Tidak ada billing aktif untuk pembayaran ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/payments/{id}/status:
