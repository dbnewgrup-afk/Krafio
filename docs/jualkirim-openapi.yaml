      tags: [Payment]
      summary: Daftar metode pembayaran aktif
      description: Metode pembayaran aktif beserta biaya admin (sudah termasuk override fee per organisasi).
      operationId: apiListPaymentMethods
      security:
        - bearerAuth: []
          apiKeyAuth: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    type: object
                    properties:
                      methods:
                        type: array
                        items: { type: object }
                        description: Termasuk metode `wallet` (bayar dari saldo) dan metode gateway (VA/QRIS/dll)
                      wallet_balance:
                        type: number
                        example: 150000
                        description: Saldo wallet organisasi saat ini
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/disbursement-batches/validate:
    post:
      tags: [Disbursement]
      summary: Periksa daftar rekening tanpa membuat batch
      description: |
        Memvalidasi daftar rekening tujuan dan menghitung total terhadap saldo wallet saat ini.
        Tidak ada saldo yang dipotong. Kirim sebagai JSON (`items`) atau upload CSV (`multipart/form-data`, field `file`).

        Format CSV (header wajib, urutan tetap, koma atau titik koma):
        `bank_code,account_number,account_holder,amount,email,phone,note` — maksimal 100 baris, file maksimal 1 MB.

        Permission role yang dibutuhkan: `multi-disbursement-create`.
      operationId: apiValidateDisbursementBatch
      security:
        - bearerAuth: []
          apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/DisbursementItemInput'
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File .csv
      responses:
        '200':
          description: Hasil validasi (cek `summary.invalid_items`, `summary.sufficient`, dan `errors`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    $ref: '#/components/schemas/DisbursementValidationResult'
        '400':
          description: Format request / file CSV tidak valid (header salah, lebih dari 100 baris, bukan .csv)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/disbursement-batches:
    get:
      tags: [Disbursement]
      summary: Daftar batch disbursement organisasi
      description: 'Permission role yang dibutuhkan: `multi-disbursement-read`.'
      operationId: apiListDisbursementBatches
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          description: Cari berdasarkan kode batch
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [scheduled, processing, success, partial, failed, cancelled] }
        - name: start_date
          in: query
          description: Filter tanggal dibuat >= (YYYY-MM-DD)
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Filter tanggal dibuat <= (YYYY-MM-DD)
          schema: { type: string, format: date }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    type: object
                    properties:
                      batches:
                        type: array
                        items:
                          $ref: '#/components/schemas/DisbursementBatch'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Disbursement]
      summary: Buat batch disbursement (langsung atau terjadwal)
      description: |
        Memvalidasi item, lalu **langsung memotong saldo wallet** sebesar
        `total_amount + total_fee` (fee = biaya wallet × jumlah rekening), termasuk untuk batch terjadwal.

        - Tanpa `scheduled_at`: status `processing`, dikirim oleh worker dalam ±1 menit.
        - Dengan `scheduled_at`: status `scheduled`, dikirim pada waktu tersebut; bisa dibatalkan
          lewat `POST /api/v1/disbursement-batches/{id}/cancel` dengan pengembalian saldo penuh.

        Nominal + fee rekening yang gagal dikembalikan otomatis ke saldo. Pantau hasil per rekening
        lewat `GET /api/v1/disbursement-batches/{id}`.

        Permission role yang dibutuhkan: `multi-disbursement-create`.
      operationId: apiCreateDisbursementBatch
      security:
        - bearerAuth: []
          apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisbursementBatchRequest'
      responses:
        '201':
          description: Batch dibuat dan saldo sudah dipotong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Batch disbursement berhasil dibuat }
                  data:
                    $ref: '#/components/schemas/DisbursementBatch'
        '400':
          description: |
            Request tidak bisa diproses: saldo tidak mencukupi (`Saldo tidak mencukupi`, `data` berisi hasil validasi),
            jadwal tidak valid (minimal 5 menit, maksimal 90 hari ke depan), atau payment gateway tidak aktif.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Saldo tidak mencukupi }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/DisbursementValidationResult'
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Ada rekening yang tidak valid; `data` berisi hasil validasi per item
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'data rekening tidak valid, periksa kembali' }
                  data:
                    $ref: '#/components/schemas/DisbursementValidationResult'

  /api/v1/disbursement-batches/{id}:
    get:
      tags: [Disbursement]
      summary: Detail batch beserta status tiap rekening
      description: 'Permission role yang dibutuhkan: `multi-disbursement-read`.'
      operationId: apiDisbursementBatchDetail
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    $ref: '#/components/schemas/DisbursementBatchDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Batch tidak ditemukan (atau milik organisasi lain)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/disbursement-batches/{id}/cancel:
    post:
      tags: [Disbursement]
      summary: Batalkan batch terjadwal
      description: |
        Hanya batch berstatus `scheduled` yang belum dieksekusi. Seluruh saldo yang dipotong
        (`total_amount + total_fee`) dikembalikan ke wallet.

        Permission role yang dibutuhkan: `multi-disbursement-cancel`.
      operationId: apiCancelDisbursementBatch
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: Batch dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Batch tidak bisa dibatalkan (sudah diproses / selesai / dibatalkan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Batch tidak ditemukan (atau milik organisasi lain)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT dari endpoint login, berlaku 24 jam
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: API key organisasi (23 karakter, huruf besar + angka)

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }

  responses:
    Unauthorized:
      description: Token tidak valid/kedaluwarsa, X-API-KEY kosong, atau tidak cocok dengan organisasi user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Role user di organisasi ini tidak memiliki permission yang dibutuhkan, atau user sudah bukan anggota organisasi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Anda tidak memiliki akses untuk aksi ini
            data: null

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: rahasia123

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Login berhasil
        data:
          type: object
          properties:
            token:
              type: string
              description: JWT HS256, berlaku 24 jam
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            expires_at:
              type: string
              format: date-time
              example: '2026-07-03T10:00:00+07:00'
            organizations:
              type: array
              description: Semua organisasi milik user beserta `api_key` untuk header `X-API-KEY`
              items:
                $ref: '#/components/schemas/Organization'

    MeResponse:
      type: object
      properties:
        message:
          type: string
          example: Berhasil
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            organizations:
              type: array
              items:
                $ref: '#/components/schemas/Organization'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
          example: Budi
        last_name:
          type: string
          example: Santoso

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Toko A
        api_key:
          type: string
          description: 23 karakter, huruf besar + angka
          example: A1B2C3D4E5F6G7H8I9J0K1L

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          nullable: true
          example: null

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Validasi gagal
        data:
          type: object
          additionalProperties:
            type: string
          example:
            email: Email wajib diisi

    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Gudang Utama }
        responsible_name: { type: string, example: Budi }
        responsible_phone: { type: string, example: '081234567890' }
        email: { type: string, format: email }
        postal_code: { type: string, example: '40111' }
        postal_code_id: { type: integer, format: int64, example: 12345 }
        address: { type: string, example: Jl. Merdeka No. 1 }
        latitude: { type: string, example: '-6.914744' }
        longitude: { type: string, example: '107.609810' }
        is_default: { type: boolean }

    SaveAddressRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, example: Gudang Utama }
        responsible_name: { type: string, example: Budi }
        responsible_phone: { type: string, example: '081234567890' }
        email: { type: string, format: email }
        postal_code: { type: string, example: '40111' }
        postal_code_id:
          type: integer
          format: int64
          description: ID kode pos dari GET /api/v1/shipping/postal-codes
        address: { type: string, example: Jl. Merdeka No. 1 }
        latitude: { type: string, example: '-6.914744' }
        longitude: { type: string, example: '107.609810' }
        is_default: { type: boolean }

    SaveCheckoutRequest:
      type: object
      required: [pickup, orders]
      properties:
        pickup:
          type: object
          required: [type, volume]
          properties:
            type:
              type: string
              enum: [scheduled, dropoff]
            is_sameday: { type: boolean }
            datetime:
              type: string
              example: '2026-07-04T09:00'
              description: Wajib untuk type=scheduled, format YYYY-MM-DDTHH:mm
            address_id:
              type: string
              format: uuid
              description: Alamat existing; kosongkan jika memakai address_data
            address_data:
              type: object
              description: Alamat pickup baru inline (dibuat otomatis)
            volume: { type: string, example: '1-5' }
        orders:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SaveOrderRequest'

    SaveOrderRequest:
      type: object
      required: [customer_name, customer_phone, customer_address, postal_code_id, postal_code_text, payment_method, courier_code, services_type, services_name]
      properties:
        customer_name: { type: string }
        customer_phone: { type: string, example: '081234567890' }
        customer_address: { type: string }
        customer_landmark: { type: string }
        postal_code_id: { type: string, example: '12345' }
        postal_code_text: { type: string, example: '40111' }
        payment_method:
          type: string
          enum: [COD, NON_COD]
        shipping_instruction: { type: string }
        use_insurance: { type: boolean }
        total_price: { type: string, example: '150000' }
        total_weight: { type: string, description: Berat total dalam gram, example: '1000' }
        items:
          type: array
          items:
            type: object
            required: [qty]
            properties:
              product_id: { type: string }
              variant_id: { type: string }
              qty: { type: integer, minimum: 1 }
              product_name: { type: string }
              sku: { type: string }
              price: { type: number }
              weight: { type: number, description: Berat per item dalam gram }
              category: { type: string }
              subcategory: { type: string }
              length: { type: number }
              width: { type: number }
              height: { type: number }
              is_new: { type: boolean, description: Produk baru, belum ada di database }
              save_to_db: { type: boolean, description: Simpan produk baru ke database }
        courier_code: { type: string, example: jne }
        services_type: { type: string, example: REG }
        services_name: { type: string, example: JNE Reguler }
        custom_courier_id: { type: string, format: uuid }
        shipping_cost: { type: string, example: '12000' }
        insurance_amount: { type: string, example: '0' }
        cod_fee: { type: string, example: '0' }

    OrderListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_code: { type: string }
        transaction_id: { type: string }
        courier: { type: string, example: JNE Reguler }
        address: { type: string }
        status: { type: string, example: IN_TRANSIT }
        created_at: { type: string, example: '2026-07-03 10:00:00' }

    MessageResponse:
      type: object
      properties:
        message: { type: string, example: Berhasil }
        data:
          type: object
          nullable: true
          example: null

    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 42 }
        total_filtered: { type: integer, example: 42 }

    SettlementStatus:
      type: object
      description: Status pencairan dana (kosong jika belum ada pembayaran masuk)
      properties:
        code:
          type: string
          description: '`progress` | `disburse` | `completed` | `failed` | kosong'
          example: completed
        label: { type: string, example: Selesai }

    SaveInvoiceItem:
      type: object
      required: [description, qty]
      properties:
        description: { type: string, example: Jasa desain logo }
        qty: { type: number, example: 1 }
        unit: { type: string, example: pcs }
        price: { type: number, example: 150000 }
        discount: { type: number, example: 0 }
        tax_percent: { type: number, example: 11 }

    SaveTaxDeduction:
      type: object
      required: [name]
      properties:
        name: { type: string, example: PPh 23 }
        rate_percent: { type: number, example: 2 }

    SaveInvoiceRequest:
      type: object
      required:
        - customer_name
        - customer_phone
        - customer_email
        - admin_fee_paid_by
        - invoice_date
        - due_date
        - items
      properties:
        customer_name: { type: string, example: Budi Santoso }
        customer_phone: { type: string, example: '081234567890' }
        customer_email: { type: string, format: email }
        customer_address: { type: string }
        notes: { type: string }
        settlement_type:
          type: string
          enum: [bank, wallet]
          default: bank
          description: >-
            Tujuan pencairan dana. `bank` = transfer ke rekening bank organisasi
            (bank_account_id wajib), `wallet` = dana masuk ke saldo wallet organisasi.
        bank_account_id:
          type: string
          format: uuid
          description: Rekening bank organisasi tujuan pencairan dana (wajib jika settlement_type=bank)
        admin_fee_paid_by:
          type: string
          enum: [merchant, customer]
        logo_url: { type: string }
        invoice_date: { type: string, format: date, example: '2026-07-06' }
        due_date: { type: string, format: date, example: '2026-07-20' }
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SaveInvoiceItem'
        tax_deductions:
          type: array
          items:
            $ref: '#/components/schemas/SaveTaxDeduction'

    SavePaymentRequest:
      type: object
      required:
        - from_name
        - from_email
        - vendor_id
        - admin_fee_paid_by
        - payment_date
        - due_date
        - items
      properties:
        logo_url: { type: string }
        from_name: { type: string, example: Toko A }
        from_description: { type: string }
        from_phone: { type: string, example: '081234567890' }
        from_email: { type: string, format: email }
        vendor_id:
          type: string
          format: uuid
          description: Vendor penerima pembayaran (harus milik organisasi)
        admin_fee_paid_by:
          type: string
          enum: [merchant, vendor]
        payment_date: { type: string, format: date, example: '2026-07-06' }
        due_date: { type: string, format: date, example: '2026-07-20' }
        notes: { type: string }
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SaveInvoiceItem'
        tax_deductions:
          type: array
          items:
            $ref: '#/components/schemas/SaveTaxDeduction'

    InvoiceListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoice_number: { type: string, example: INV-20260706-0001 }
        customer_name: { type: string }
        customer_email: { type: string }
        grand_total: { type: number }
        status: { type: string, example: sent }
        status_label: { type: string, example: Terkirim }
        settlement_status: { type: string, example: completed }
        settlement_status_label: { type: string, example: Selesai }
        invoice_date: { type: string, example: '06/07/2026' }
        due_date: { type: string, example: '20/07/2026' }
        is_editable: { type: boolean }
        is_deletable: { type: boolean }

    PaymentListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        payment_number: { type: string, example: PAY-20260706-0001 }
        vendor_name: { type: string }
        grand_total: { type: number }
        status: { type: string, example: pending }
        status_label: { type: string, example: Menunggu }
        settlement_status: { type: string, example: '' }
        settlement_status_label: { type: string, example: '' }
        payment_date: { type: string, example: '06/07/2026' }
        due_date: { type: string, example: '20/07/2026' }
        is_editable: { type: boolean }
        is_deletable: { type: boolean }

    CheckoutResponse:
      type: object
      properties:
        message: { type: string, example: Berhasil }
        data:
          type: object
          properties:
            paid:
              type: boolean
              description: >-
                true jika pembayaran langsung lunas (metode `wallet` — saldo terpotong,
                tidak ada instruksi VA/QR/link)
            payment_method: { type: string, example: QRIS }
            qr_string: { type: string, description: 'Isi QRIS (kosong jika bukan QRIS)' }
            payment_code: { type: string, description: 'Nomor VA (kosong jika bukan VA)' }
            payment_link: { type: string }
            total_amount: { type: number, example: 505000 }
            admin_fee: { type: number, example: 5000 }

    DisbursementItemInput:
      type: object
      required: [bank_code, account_number, account_holder, amount]
      properties:
        row:
          type: integer
          description: Nomor baris (opsional; untuk CSV diisi otomatis dengan nomor baris file)
          example: 1
        bank_code:
          type: string
          enum: [BCA, BNI, BRI, MANDIRI, CIMB, SEABANK, UOB, OCBC]
          example: BCA
        account_number:
          type: string
          pattern: '^[0-9]{5,20}$'
          example: '1234567890'
        account_holder:
          type: string
          maxLength: 255
          example: Budi Santoso
        amount:
          type: number
          description: Nominal bilangan bulat dalam Rupiah, minimal 25.000
          minimum: 25000
          example: 150000
        email:
          type: string
          format: email
          description: Opsional, hanya disimpan
        phone:
          type: string
          description: Opsional, hanya disimpan (8-15 digit)
          example: '081234567890'
        note:
          type: string
          description: Opsional, catatan per rekening
          example: Gaji September

    DisbursementItemValidation:
      allOf:
        - $ref: '#/components/schemas/DisbursementItemInput'
        - type: object
          properties:
            valid: { type: boolean, example: false }
            errors:
              type: array
              items: { type: string }
              example: [bank tidak didukung, nominal minimal Rp 25.000]

    DisbursementValidationSummary:
      type: object
      properties:
        total_items: { type: integer, example: 2 }
        valid_items: { type: integer, example: 2 }
        invalid_items: { type: integer, example: 0 }
        total_amount: { type: number, example: 150000 }
        fee_per_item: { type: number, example: 2500 }
        total_fee: { type: number, example: 5000 }
        total_deduct:
          type: number
          description: total_amount + total_fee, yang akan dipotong dari saldo
          example: 155000
        balance: { type: number, example: 500000 }
        balance_after: { type: number, example: 345000 }
        sufficient: { type: boolean, example: true }

    DisbursementValidationResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DisbursementItemValidation'
        summary:
          $ref: '#/components/schemas/DisbursementValidationSummary'
        errors:
          type: array
          description: Error tingkat batch (mis. lebih dari 100 rekening)
          items: { type: string }
          example: []

    CreateDisbursementBatchRequest:
      type: object
      required: [items]
      properties:
        source:
          type: string
          enum: [manual, csv, saved]
          default: manual
          description: Asal data. `csv` juga menyimpan rekening baru ke daftar rekening organisasi.
        scheduled_at:
          type: string
          description: |
            Kosongkan untuk kirim sekarang. RFC3339 (`2026-09-25T09:00:00+07:00`) atau
            `YYYY-MM-DDTHH:mm` (dianggap WIB). Minimal 5 menit, maksimal 90 hari ke depan.
          example: '2026-09-25T09:00:00+07:00'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DisbursementItemInput'

    DisbursementItemCounts:
      type: object
      properties:
        total: { type: integer, example: 10 }
        success: { type: integer, example: 8 }
        failed: { type: integer, example: 1 }
        processing:
          type: integer
          description: Menunggu + sedang diproses
          example: 1

    DisbursementBatch:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: MD-20260922-0001 }
        source: { type: string, enum: [manual, csv, saved] }
        status:
          type: string
          enum: [scheduled, processing, success, partial, failed, cancelled]
          example: processing
        status_label: { type: string, example: Diproses }
        scheduled_at:
          type: string
          nullable: true
          description: Waktu kirim (WIB, format `02 Jan 2006 15:04`); null jika kirim langsung
          example: 25 Sep 2026 09:00
        executed_at: { type: string, nullable: true, example: 22 Sep 2026 10:15 }
        completed_at: { type: string, nullable: true, example: null }
        total_items: { type: integer, example: 10 }
        total_amount: { type: number, example: 1500000 }
        total_fee: { type: number, example: 25000 }
        total_deduct: { type: number, example: 1525000 }
        total_refunded:
          type: number
          description: Total saldo yang sudah dikembalikan (rekening gagal / batch dibatalkan)
          example: 152500
        counts:
          $ref: '#/components/schemas/DisbursementItemCounts'
        cancellable: { type: boolean, example: false }
        created_at: { type: string, example: 22 Sep 2026 10:14 }

    DisbursementItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        row: { type: integer, example: 2 }
        bank_code: { type: string, example: BCA }
        account_number: { type: string, example: '1234567890' }
        account_holder: { type: string, example: Budi Santoso }
        email: { type: string }
        phone: { type: string }
        note: { type: string }
        amount: { type: number, example: 150000 }
        fee: { type: number, example: 2500 }
        status:
          type: string
          enum: [pending, processing, success, failed]
          example: success
        status_label: { type: string, example: Berhasil }
        disbursement_id: { type: string, description: ID transaksi di payment gateway }
        error_message: { type: string, example: '' }
        refunded:
          type: boolean
          description: true jika nominal + fee rekening ini sudah dikembalikan ke saldo
        updated_at: { type: string, example: 22 Sep 2026 10:16 }

    DisbursementBatchDetail:
      allOf:
        - $ref: '#/components/schemas/DisbursementBatch'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DisbursementItem'
