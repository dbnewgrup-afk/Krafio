        - name: start_date
          in: query
          description: Filter payment_date >= (YYYY-MM-DD)
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Filter payment_date <= (YYYY-MM-DD)
          schema: { type: string, format: date }
        - name: sort_dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
