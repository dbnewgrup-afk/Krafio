      tags: [Payment]
      summary: Status pembayaran (polling)
      operationId: apiPaymentStatus
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: processing }
                      paid: { type: boolean, example: false }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pembayaran tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/payment-methods:
