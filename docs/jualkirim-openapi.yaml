openapi: 3.0.3
info:
  title: JualKirim API v1
  description: |
    API v1 JualKirim untuk aplikasi eksternal.

    Autentikasi memakai dua lapis:
    1. **JWT** (`Authorization: Bearer <token>`) — identitas user, didapat dari endpoint login, berlaku 24 jam.
    2. **API Key organisasi** (`X-API-KEY`) — menentukan organisasi mana yang menjadi konteks request.
       Key harus milik salah satu organisasi user di dalam token (dicocokkan dengan claims JWT, tanpa query database).

    Endpoint yang memindahkan uang (Multi Disbursement dan checkout pembayaran) juga mengecek
    **permission role** user di organisasi tersebut langsung dari database. Jika role user tidak
    memiliki permission yang disebut di tiap endpoint (atau user sudah dikeluarkan dari organisasi),
    response-nya `403`.
  version: 1.0.0
servers:
  - url: /
    description: Server saat ini
tags:
  - name: Auth
    description: Autentikasi API v1
  - name: Address
    description: Alamat pickup organisasi
  - name: Wallet
    description: Saldo wallet organisasi
  - name: Courier
    description: Daftar kurir aktif
  - name: Shipping
    description: Cek ongkir dan pencarian kode pos
  - name: Orders
    description: Pembuatan dan pengelolaan order
  - name: Product
    description: Produk organisasi
  - name: Category
    description: Kategori dan subkategori barang
  - name: Invoice
    description: Penagihan ke customer (tagihan)
  - name: Payment
    description: Pembayaran ke vendor
  - name: Disbursement
    description: Multi disbursement — kirim saldo wallet ke banyak rekening sekaligus

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login dan dapatkan JWT
      description: |
        Login dengan email + password user terdaftar (wajib sudah verifikasi email).
        Response memuat semua organisasi milik user beserta `api_key` masing-masing
        (gunakan sebagai header `X-API-KEY`). Token JWT juga memuat data organisasi yang sama.
      operationId: apiLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Format request tidak valid atau validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Email/password salah atau email belum diverifikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  value:
                    message: Email atau kata sandi tidak valid
                    data: null
                notVerified:
                  value:
                    message: Email belum diverifikasi
                    data: null
        '500':
          description: Kesalahan server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me:
    get:
      tags: [Auth]
      summary: Profil user dan semua organisasinya
      description: |
        Mengembalikan profil user beserta seluruh organisasi yang dia miliki,
        dibaca sepenuhnya dari claims JWT (tanpa query database).
        Hanya butuh Bearer token — tidak perlu `X-API-KEY`.
      operationId: apiMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Token tidak valid/kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingToken:
                  value:
                    message: Token tidak ditemukan
                    data: null
                invalidToken:
                  value:
                    message: Token tidak valid atau sudah kedaluwarsa
                    data: null

  /api/v1/addresses:
    get:
      tags: [Address]
      summary: Daftar alamat pickup organisasi
      operationId: apiListAddresses
      security:
        - bearerAuth: []
          apiKeyAuth: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Address]
      summary: Buat alamat pickup baru
      description: Alamat pertama organisasi otomatis menjadi default. Alamat juga didaftarkan sebagai pickup point di AutoKirim.
      operationId: apiCreateAddress
      security:
        - bearerAuth: []
          apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAddressRequest'
      responses:
        '201':
          description: Alamat berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Alamat berhasil dibuat }
                  data:
                    $ref: '#/components/schemas/Address'
        '400':
          description: Format request tidak valid atau validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Gagal membuat alamat (mis. nama duplikat, kode pos tidak valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/addresses/{id}:
    put:
      tags: [Address]
      summary: Perbarui alamat pickup
      operationId: apiUpdateAddress
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAddressRequest'
      responses:
        '200':
          description: Alamat berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Alamat berhasil diperbarui }
                  data:
                    $ref: '#/components/schemas/Address'
        '400':
          description: Format request tidak valid atau validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Alamat tidak ditemukan atau bukan milik organisasi aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Address]
      summary: Hapus alamat pickup (soft delete)
      operationId: apiDeleteAddress
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: Alamat berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Alamat tidak ditemukan atau bukan milik organisasi aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/wallet/balance:
    get:
      tags: [Wallet]
      summary: Saldo wallet organisasi
      description: Order NON_COD memotong saldo wallet; pastikan saldo cukup sebelum membuat order.
      operationId: apiWalletBalance
      security:
        - bearerAuth: []
          apiKeyAuth: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    type: object
                    properties:
                      organization_id: { type: string, format: uuid }
                      balance: { type: number, example: 150000 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/couriers:
    get:
      tags: [Courier]
      summary: Daftar kurir aktif
      operationId: apiListCouriers
      security:
        - bearerAuth: []
          apiKeyAuth: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: jne }
                        name: { type: string, example: JNE }
                        logo: { type: string, example: /assets/couriers/jne.png }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/shipping/postal-codes:
    get:
      tags: [Shipping]
      summary: Cari kode pos (tujuan/asal pengiriman)
      description: |
        Mencari kode pos berdasarkan kata kunci. Dipakai untuk mendapatkan `postal_code_id`
        (tujuan) dan `send_postal_id` (asal) yang dibutuhkan `POST /api/v1/shipping/check-cost`.

        Pencarian mencocokkan kata kunci ke kolom kelurahan, kecamatan, kota, dan kode pos.
        Endpoint ini tidak memerlukan autentikasi.

        **Perhatian:** response memakai key `results` (format Select2), bukan `data` seperti
        endpoint lain. Nilai yang dipakai sebagai `postal_code_id`/`send_postal_id` adalah
        field `id` (UUID), **bukan** `postal_code` (5 digit angka).
      operationId: apiSearchPostalCodes
      security: []
      parameters:
        - name: q
          in: query
          description: Kata kunci. Jika kosong, mengembalikan 20 data pertama diurutkan kode pos menaik.
          schema: { type: string, example: Tebet }
      responses:
        '200':
          description: Berhasil (maksimal 20 hasil, tidak ada paging)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Dipakai sebagai `postal_code_id` / `send_postal_id` di check-cost
                        text:
                          type: string
                          description: Label siap tampil
                          example: DKI Jakarta - Jakarta Selatan, Tebet, Tebet Barat (12810)
                        postal_code: { type: string, example: '12810' }
                        province: { type: string, example: DKI Jakarta }
                        city: { type: string, example: Jakarta Selatan }
                        sub_district: { type: string, example: Tebet }
                        urban: { type: string, example: Tebet Barat }
        '400':
          description: Query gagal diproses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/shipping/check-cost:
    post:
      tags: [Shipping]
      summary: Cek ongkir semua kurir
      description: |
        Menghitung ongkir dari titik asal ke kode pos tujuan. Hasilnya dipakai untuk mengisi
        `courier_code`, `services_type`, `services_name`, dan `shipping_cost` saat membuat order.

        **Asal** wajib salah satu:
        - `pickup_address_id` — alamat pickup tersimpan (dipakai pada alur create order).
        - `send_postal_id` — id kode pos dari `GET /api/v1/shipping/postal-codes` (cek ongkir publik).

        **Autentikasi opsional.** Tanpa header apa pun endpoint tetap jalan dan mengembalikan harga
        normal. Jika mengirim `Authorization: Bearer <jwt>` **dan** `X-API-KEY`, diskon organisasi
        ikut diterapkan pada `service_price`.
      operationId: apiCheckShippingCost
      security:
        - {}
        - bearerAuth: []
          apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weight, postal_code_id]
              properties:
                weight:
                  type: number
                  description: Berat dalam gram. Wajib, harus lebih dari 0.
                  example: 1000
                postal_code_id:
                  type: string
                  format: uuid
                  description: Wajib. Id kode pos tujuan dari `GET /api/v1/shipping/postal-codes`.
                pickup_address_id:
                  type: string
                  format: uuid
                  description: Id alamat pickup sebagai asal. Wajib jika `send_postal_id` kosong.
                send_postal_id:
                  type: string
                  format: uuid
                  description: Id kode pos sebagai asal. Wajib jika `pickup_address_id` kosong.
                courier_code:
                  type: string
                  description: Filter ke satu kurir. Kosongkan untuk mengambil semua kurir.
                  example: jne
                length: { type: number, description: Panjang paket (cm), example: 10 }
                width: { type: number, description: Lebar paket (cm), example: 10 }
                height: { type: number, description: Tinggi paket (cm), example: 10 }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        courier_code: { type: string, example: jne }
                        courier_name: { type: string, example: JNE }
                        service_code:
                          type: string
                          description: Dikirim sebagai `services_type` saat create order
                          example: REG
                        service_name:
                          type: string
                          description: Dikirim sebagai `services_name` saat create order
                          example: Layanan Reguler
                        service_price:
                          type: number
                          description: Harga setelah diskon. Dikirim sebagai `shipping_cost` saat create order.
                          example: 9000
                        original_price:
                          type: number
                          description: Harga sebelum diskon
                          example: 10000
                        service_insurance:
                          type: number
                          description: Rate asuransi dalam bentuk desimal (0.002 = 0,2%)
                          example: 0.002
                        etd:
                          type: string
                          description: Estimasi waktu pengiriman
                          example: 1-2 hari
                        discount_type:
                          type: string
                          description: Kosong jika tidak ada diskon yang berlaku
                          enum: [PERCENTAGE, NOMINAL, '']
                          example: PERCENTAGE
                        discount_value:
                          type: number
                          description: Nilai persen (jika PERCENTAGE) atau nominal (jika NOMINAL)
                          example: 10
                        discount_amount:
                          type: number
                          description: Jumlah diskon hasil perhitungan
                          example: 1000
        '400':
          description: |
            Format request tidak valid, validasi gagal (`weight` kosong/<= 0, `postal_code_id` kosong),
            atau `pickup_address_id` dan `send_postal_id` sama-sama kosong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: |
            Alamat pickup/area asal/area tujuan tidak ditemukan, district id tidak terpetakan,
            atau panggilan ke penyedia ongkir gagal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Buat order (checkout pickup + daftar order)
      description: |
        Membuat pickup order beserta order-ordernya sekaligus.
        `pickup.address_id` (alamat existing) atau `pickup.address_data` (alamat baru inline) wajib salah satu.
        Order NON_COD memotong saldo wallet organisasi — gagal jika saldo tidak cukup.
        Dapatkan `courier_code`, `services_type`, `services_name`, dan `shipping_cost` dari `POST /api/v1/shipping/check-cost`.
      operationId: apiCreateOrders
      security:
        - bearerAuth: []
          apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCheckoutRequest'
      responses:
        '201':
          description: Order berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Order berhasil dibuat }
                  data:
                    type: object
                    properties:
                      pickup_order_id: { type: string, format: uuid }
        '400':
          description: Format request tidak valid atau validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Validasi order gagal atau saldo wallet tidak cukup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Orders]
      summary: Daftar order organisasi
      operationId: apiListOrders
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            example: PENDING
          description: Nama status (PENDING, REQUESTED, IN_TRANSIT, DELIVERED, CANCELLED, dst.)
        - name: start_date
          in: query
          schema: { type: string, example: '2026-07-01' }
        - name: end_date
          in: query
          schema: { type: string, example: '2026-07-31' }
        - name: search
          in: query
          schema: { type: string }
          description: Cari di order_code, transaction_id, nama/telepon/alamat customer, kurir
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: sort_dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrderListItem'
                      pagination:
                        type: object
                        properties:
                          page: { type: integer }
                          per_page: { type: integer }
                          total: { type: integer }
                          total_filtered: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Detail order + pickup order
      operationId: apiOrderDetail
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    type: object
                    properties:
                      order: { type: object }
                      status: { type: string, example: IN_TRANSIT }
                      pickup_order: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order tidak ditemukan atau bukan milik organisasi aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Batalkan order
      operationId: apiCancelOrder
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                remark:
                  type: string
                  example: Stok habis
      responses:
        '200':
          description: Order berhasil dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order tidak ditemukan atau bukan milik organisasi aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Order tidak dapat dibatalkan (belum ada transaction ID, sudah dibatalkan, atau ditolak kurir)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/products:
    get:
      tags: [Product]
      summary: Daftar produk organisasi
      operationId: apiListProducts
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    type: array
                    items: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Product]
      summary: Buat produk baru
      description: '`organization_id` diambil dari konteks X-API-KEY, nilai di payload diabaikan.'
      operationId: apiCreateProduct
      security:
        - bearerAuth: []
          apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: Produk berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Produk berhasil dibuat }
                  data: { type: object }
        '400':
          description: Format request tidak valid atau validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Gagal membuat produk (mis. SKU duplikat)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/categories:
    get:
      tags: [Category]
      summary: Daftar kategori barang
      operationId: apiListCategories
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    type: array
                    items: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/subcategories:
    get:
      tags: [Category]
      summary: Daftar subkategori barang
      operationId: apiListSubcategories
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category_code
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    type: array
                    items: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/invoices:
    get:
      tags: [Invoice]
      summary: Daftar tagihan organisasi
      operationId: apiListInvoices
      security:
        - bearerAuth: []
          apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          description: Cari di nama customer, nomor tagihan, email customer
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [draft, sent, paid, cancelled] }
        - name: start_date
          in: query
          description: Filter invoice_date >= (YYYY-MM-DD)
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Filter invoice_date <= (YYYY-MM-DD)
          schema: { type: string, format: date }
        - name: sort_dir
          in: query
          description: Urutan berdasarkan invoice_date
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Berhasil }
                  data:
                    type: object
                    properties:
                      invoices:
                        type: array
                        items:
                          $ref: '#/components/schemas/InvoiceListItem'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Invoice]
      summary: Buat tagihan baru
      description: |
        Membuat tagihan dan mengirim email berisi link pembayaran ke customer.
        Pembayaran dilakukan customer lewat `payment_link` (halaman publik) —
        dana masuk ke rekening bank organisasi (`bank_account_id`) atau ke saldo
        wallet organisasi (`settlement_type=wallet`).
      operationId: apiCreateInvoice
      security:
        - bearerAuth: []
          apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveInvoiceRequest'
      responses:
        '201':
          description: Tagihan dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Tagihan berhasil dibuat dan dikirim ke pelanggan }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      invoice_number: { type: string, example: INV-20260706-0001 }
                      status: { type: string, example: sent }
                      grand_total: { type: number, example: 150000 }
                      payment_link: { type: string, example: 'https://app.jualkirim.id/invoice/pay/abc123' }
        '400':
          description: Format request tidak valid atau validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Gagal membuat tagihan (mis. rekening bank tidak valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

