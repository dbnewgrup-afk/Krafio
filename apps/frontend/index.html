<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Krafio" />
    <meta property="og:title" content="Krafio — Foto, video, konten, website, dan SEO. Satu akun." />
    <meta property="og:description" content="Platform produksi dan pemasaran konten berbasis AI untuk kreator, UMKM, dan brand. Biaya kredit terlihat sebelum Generate." />
    <meta property="og:image" content="/assets/img/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <title>Krafio</title>
    <script>
      // Cegah flash tema salah (Design Spec §4.3) + bahasa awal (§5.2)
      (function () {
        try {
          var t = localStorage.getItem('krafio.theme')
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          var l = localStorage.getItem('krafio.lang')
          if (!l) l = (navigator.language || 'id').toLowerCase().indexOf('en') === 0 ? 'en' : 'id'
          document.documentElement.setAttribute('lang', l === 'en' ? 'en' : 'id')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <style>
      /* Splash inline (Design Spec §12.4) — tampil sebelum bundle JS selesai */
      #krafio-splash { position: fixed; inset: 0; z-index: 110; display: grid; place-items: center; background: #0B1020; color: #E5E9F5; font-family: system-ui, sans-serif; }
      #krafio-splash .box { display: grid; gap: 14px; justify-items: center; }
      #krafio-splash .bar { width: 140px; height: 3px; border-radius: 3px; background: #1E2742; overflow: hidden; }
      #krafio-splash .bar i { display: block; width: 40%; height: 100%; background: #818CF8; animation: ks 1.1s ease-in-out infinite; }
      #krafio-splash small { font-size: 13px; color: #A3ADC8; }
      @keyframes ks { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #krafio-splash .bar i { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="krafio-splash" role="status" aria-live="polite">
      <div class="box">
        <svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#818CF8"/><rect x="17" y="15" width="8" height="34" rx="4" fill="#0B1020"/><path d="M23 33L40 49M23 31L31 23" stroke="#0B1020" stroke-width="8" stroke-linecap="round"/><path d="M40.5 10C41.71 17.48 44.02 19.79 51.5 21 44.02 22.21 41.71 24.52 40.5 32 39.29 24.52 36.98 22.21 29.5 21 36.98 19.79 39.29 17.48 40.5 10Z" fill="#0B1020"/></svg>
        <div class="bar"><i></i></div>
        <small>Memuat…</small>
      </div>
    </div>
    <div id="root"></div>
    <noscript>Krafio membutuhkan JavaScript untuk berjalan.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
